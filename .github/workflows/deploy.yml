name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          # 💡 env에서 정의한 변수들을 script 환경으로 넘겨줍니다.
          envs: AES_SECRET_KEY, DB_HOST, DB_NAME, DB_PASSWORD, DB_USER, KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET, KAKAO_REDIRECT_URI, FRONTEND_URL
          script: |
            cd ~/squardGoalz
            
            # 최신 코드 가져오기
            git pull origin main
            
            # Secrets 값을 이용해 .env 파일 동적 생성
            echo "AES_SECRET_KEY=$AES_SECRET_KEY" > .env
            echo "DB_HOST=$DB_HOST" >> .env
            echo "DB_NAME=$DB_NAME" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_USER=$DB_USER" >> .env
            echo "KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID" >> .env
            echo "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET" >> .env
            echo "KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI" >> .env
            echo "FRONTEND_URL=$FRONTEND_URL" >> .env
            
            # 가상환경 활성화 및 패키지 설치
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 포트 8000을 사용하는 프로세스(uvicorn)만 정확히 찾아 종료
            PID=$(lsof -t -i:8000 || echo "")
            if [ ! -z "$PID" ]; then
              kill -9 $PID || true
            fi
            sleep 2
            
            # tmux를 사용하여 SSH 세션과 완전히 독립된 백그라운드 실행 (143 에러 방지)
            # 기존 tmux 세션이 있다면 종료
            tmux kill-session -t backend || true
            
            # 새 tmux 세션에서 절대 경로로 uvicorn 실행 (가상환경 문제 방지)
            tmux new-session -d -s backend "$(pwd)/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > nohup.out 2>&1"
            
            sleep 3
            echo "==== UVICORN LOGS (nohup.out) ===="
            cat nohup.out || true
            echo "=================================="
            
            echo "Deployment completed successfully."
            exit 0