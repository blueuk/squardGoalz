name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        env:
          AES_SECRET_KEY: ${{ secrets.AES_SECRET_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          # 💡 env에서 정의한 변수들을 script 환경으로 넘겨줍니다.
          envs: AES_SECRET_KEY, DB_HOST, DB_NAME, DB_PASSWORD, DB_USER, KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET, KAKAO_REDIRECT_URI, FRONTEND_URL
          script: |
            cd ~/squardGoalz
            # 최신 코드 가져오기 및 강제 덮어쓰기 (로컬 충돌 방지)
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            # Secrets 값을 이용해 .env 파일 동적 생성
            echo "AES_SECRET_KEY=$AES_SECRET_KEY" > .env
            echo "DB_HOST=$DB_HOST" >> .env
            echo "DB_NAME=$DB_NAME" >> .env
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env
            echo "DB_USER=$DB_USER" >> .env
            echo "KAKAO_CLIENT_ID=$KAKAO_CLIENT_ID" >> .env
            echo "KAKAO_CLIENT_SECRET=$KAKAO_CLIENT_SECRET" >> .env
            echo "KAKAO_REDIRECT_URI=$KAKAO_REDIRECT_URI" >> .env
            echo "FRONTEND_URL=$FRONTEND_URL" >> .env
            
            # 가상환경 활성화 및 패키지 설치
            source venv/bin/activate
            pip install -r requirements.txt
            
            # 기존 프로세스 확실히 종료 (fuser, netstat, ss 총동원)
            fuser -k -n tcp 8000 2>/dev/null || true
            PID=$(netstat -nlp 2>/dev/null | grep ':8000' | awk '{print $7}' | cut -d'/' -f1 || echo "")
            if [ ! -z "$PID" ]; then kill -9 $PID || true; fi
            PID=$(ss -lptn 'sport = :8000' 2>/dev/null | grep -oP 'pid=\K[0-9]+' | head -n 1 || echo "")
            if [ ! -z "$PID" ]; then kill -9 $PID || true; fi
            
            # 리눅스 커널 프로세스 트리를 직접 뒤지는 가장 확실한 방법 (SSH 쉘 자살 방지 로직 포함)
            for pid_dir in /proc/[0-9]*; do
              # 실행 파일이 python인 경우에만 검사 (bash 스크립트 자살 방지)
              if readlink "$pid_dir/exe" 2>/dev/null | grep -q "python"; then
                if grep -a "uvicorn" "$pid_dir/cmdline" 2>/dev/null | grep -q "main:app" 2>/dev/null; then
                  kill -9 $(basename $pid_dir) || true
                fi
              fi
            done
            sleep 2
            
            # 가상환경에서 Uvicorn 실행 (nohup과 /dev/null을 이용해 SSH 세션과 완벽 분리)
            nohup $(pwd)/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > nohup.out 2>&1 < /dev/null &
            
            sleep 3
            
            echo "Deployment completed successfully."
            exit 0